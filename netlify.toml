# Netlify build settings.
# Vite 8 (Rolldown) needs Node ^20.19 or >=22.12 — older default images fail during install/build.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Fingerprinted build assets never change; cache them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
